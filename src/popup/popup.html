<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mis Notas</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../ui/logo.png" alt="" width="28" height="28">
    <h1 data-i18n="ext_name">Mis Notas</h1>
    <span class="grow"></span>
    <button id="settings" class="icon" type="button" data-i18n-title="popup_settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </button>
  </header>

  <section id="gate" hidden>
    <p id="gate-text"></p>
    <button id="gate-button" type="button"></button>
  </section>

  <main id="main" hidden>
    <div class="modes" id="modes" role="tablist">
      <button type="button" data-mode="recipe" data-i18n="mode_recipe" role="tab">Receta</button>
      <button type="button" data-mode="article" data-i18n="mode_article" role="tab">Artículo</button>
      <button type="button" data-mode="selection" data-i18n="mode_selection" role="tab">Selección</button>
      <button type="button" data-mode="page" data-i18n="mode_page" role="tab">Página</button>
      <button type="button" data-mode="link" data-i18n="mode_link" role="tab">Enlace</button>
    </div>

    <div class="field">
      <label for="title" data-i18n="field_title">Título</label>
      <input id="title" type="text" autocomplete="off">
    </div>

    <div class="field">
      <label for="folder" data-i18n="field_folder">Carpeta</label>
      <select id="folder"></select>
      <div class="row new-folder" id="new-folder" hidden>
        <input id="new-folder-name" type="text" class="grow" data-i18n-placeholder="folder_new_placeholder" autocomplete="off">
        <button id="new-folder-ok" type="button" data-i18n="folder_create">Crear</button>
        <button id="new-folder-cancel" type="button" class="text" data-i18n="cancel">Cancelar</button>
      </div>
    </div>

    <div class="field">
      <div class="row">
        <label for="content" class="grow" data-i18n="field_content">Contenido (Markdown)</label>
        <span id="extracting" class="muted small" hidden><span class="spinner"></span></span>
      </div>
      <textarea id="content" rows="11" spellcheck="false"></textarea>
    </div>

    <label class="check"><input id="save-images" type="checkbox"><span data-i18n="opt_save_images_short">Guardar copia de las imágenes</span></label>

    <div id="notice" class="notice"></div>

    <footer class="row">
      <span id="pending" class="muted small grow"></span>
      <button id="save" type="button" data-i18n="save">Guardar</button>
    </footer>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
