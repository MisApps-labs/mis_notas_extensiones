# Al subir una etiqueta vX.Y.Z, empaqueta la extensión y publica una release con los zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar versión
        run: |
          VERSION="$(jq -r .version manifest.json)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de manifest.json" >&2
            exit 1
          fi

      - name: Empaquetar
        run: tools/build.sh firefox

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Mis Notas para navegadores $GITHUB_REF_NAME" \
            --generate-notes
